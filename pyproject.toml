[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probebehavior"
version = "0.1.1"
description = "Water maze probe tests aligned on the first arrival at the empty goal"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rodrigo Orvate"}, {name = "Martín Cammarota"}]
keywords = ["Morris water maze", "probe test", "spatial memory", "behavior", "trajectory analysis", "Rtrack"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/RodrigoOrvate/probebehavior"
Issues = "https://github.com/RodrigoOrvate/probebehavior/issues"
DOI = "https://doi.org/10.5281/zenodo.23888805"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
probebehavior = "probebehavior.cli:main"

[tool.setuptools]
packages = ["probebehavior"]
